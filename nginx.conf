upstream web {
    server web:8000;
}

server {
    listen 80;
    server_name localhost;

    location / {
        proxy_pass http://web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_redirect off;
    }

    location /static/ {
        # Путь должен совпадать с тем, что вы пропишете в volumes для nginx
        alias /app/staticfiles/;
    }

    location /media/ {
        alias /app/media/;
    }
}