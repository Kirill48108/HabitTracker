name: HabitTracker CI/CD

on:
  push:
    branches: [ "main", "master", "develop" ] # Ограничьте ветки для деплоя
  pull_request:
    branches: [ "**" ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: ${{ secrets.DB_NAME }}
          POSTGRES_USER: ${{ secrets.DB_USER }}
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Poetry
        run: curl -sSL https://install.python-poetry.org | python3 - && echo "$HOME/.local/bin" >> $GITHUB_PATH
      - name: Install deps
        run: poetry install --no-interaction --no-root
      - name: Linting & Tests
        run: |
          poetry run isort . --check-only
          poetry run black . --check
          poetry run flake8 . --max-line-length=100
          poetry run pytest

  # НОВЫЙ ШАГ: Проверка сборки образа
  build-check:
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build check
        run: docker build . --file Dockerfile

  deploy:
    needs: build-check # Деплой начнется ТОЛЬКО после успешной сборки образа
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Yandex Cloud
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/HabitTracker
            git pull origin ${{ github.ref_name }}
            docker compose up -d --build --force-recreate
            docker compose exec -T web python manage.py migrate --noinput
            docker compose exec -T web python manage.py collectstatic --noinput
            docker image prune -f
